/* ================= Import Data ================= */

const IMPORT_TYPES = ['Purchase', 'Sales', 'Purchase Return', 'Sales Return', 'Stock'];

function ImportData({ onImported, onAuthError, isAdmin }) {
  const { L, lang } = useLang();
  const [type, setType] = useState('Stock');
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [history, setHistory] = useState(null);
  const lines = text ? text.split('\n').length : 0;

  function loadHistory() {
    authed('getImportHistory', [], 60000)
      .then(r => { if (r && r.ok) setHistory(r.imports); })
      .catch(() => {});
  }
  useEffect(() => { loadHistory(); }, []);

  function run(force, asOf) {
    if (!text.trim()) { Swal.fire({ icon: 'info', title: L('Paste the Busy export first', 'Pehle Busy ka export paste karo') }); return; }
    if (text.length > 22000000) {
      Swal.fire({ icon: 'warning', title: L('Paste too large', 'Paste bahut bada hai'),
        text: L('Export a shorter date range from Busy (a week or fortnight at a time) instead of splitting the same month by rows.',
                'Busy se chhota date-range nikaalo (ek hafta ya 15 din) — ek hi mahine ko row-wise mat todo.') });
      return;
    }

    // Stock import: first ask which date the snapshot represents.
    if (type === 'Stock' && !asOf) {
      Swal.fire({
        title: L('Opening stock — as of which date?', 'Opening Stock — kis date ka hai?'),
        html: '<div style="text-align:left;font-size:13px;line-height:1.6">' +
              L('This stock is the closing balance on which date?<br>Transactions dated <b>before</b> this will be skipped (they are already inside the opening balance).<br>Format <b>YYYY-MM-DD</b> (e.g. 2026-06-01).',
                'Ye stock kis din ka closing balance hai?<br>Us date <b>se pehle</b> ki transactions apne aap skip ho jayengi (wo opening balance mein already shaamil hain).<br>Format <b>YYYY-MM-DD</b> (jaise 2026-06-01).') +
              '</div>',
        input: 'text', inputPlaceholder: '2026-06-01',
        showCancelButton: true, confirmButtonText: L('Continue', 'Aage Badho'), cancelButtonText: L('Cancel', 'Cancel'),
        preConfirm: v => {
          const t = String(v || '').trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(t)) { Swal.showValidationMessage(L('Enter the date as YYYY-MM-DD', 'Date YYYY-MM-DD format mein daalo')); return false; }
          return t;
        },
      }).then(r => { if (r.isConfirmed) run(force, r.value); });
      return;
    }

    setBusy(true);
    Swal.fire({ title: L('Processing ' + type + '…', type + ' Process Ho Raha Hai…'),
      html: L('Parsing rows, detecting the date format, updating the ledger.<br>A large month can take a minute or two.',
              'Rows parse ho rahi hain, date format check ho raha hai, ledger update ho raha hai.<br>Bada mahina ho to 1-2 minute lag sakte hain.'),
      allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    const timeout = 350000;
    authed('importPastedData', [type, text, !!force, asOf || ''], timeout)
      .then(res => {
        setBusy(false);
        if (res && res.authError) { Swal.close(); onAuthError && onAuthError(); return; }

        if (res && res.needsConfirm) {
          Swal.fire({
            icon: 'warning', title: L('Opening stock already set', 'Opening Stock Pehle Se Set Hai'),
            html: '<div style="text-align:left;font-size:13px;line-height:1.7">' + res.message + '</div>',
            showCancelButton: true, confirmButtonText: L('Yes, reset opening', 'Haan, Opening Reset Karo'), confirmButtonColor: '#c62828',
            cancelButtonText: L('Cancel', 'Cancel'),
          }).then(r => { if (r.isConfirmed) run(true, asOf); });
          return;
        }

        if (!res || !res.ok) {
          Swal.fire({
            icon: res && res.duplicate ? 'warning' : 'error',
            title: res && res.duplicate ? L('Already imported', 'Pehle Se Import Ho Chuka Hai') : L('Import failed', 'Import Fail Ho Gaya'),
            text: fmtDatesInStr((res && res.message) || L('Unknown error', 'Anjaan error')),
            footer: res && res.stack ? '<pre style="text-align:left;font-size:10px;white-space:pre-wrap">' + res.stack + '</pre>' : undefined,
          });
          return;
        }

        const errHtml = (res.errors && res.errors.length)
          ? '<br><b style="color:#c62828">' + res.errors.length + ' ' + L('error row(s):', 'error rows:') + '</b><br>' +
            res.errors.slice(0, 12).map(e => '<small>' + e.type + ' — ' + (e.item || '') + '</small>').join('<br>')
          : '';
        Swal.fire({
          icon: 'success', title: res.label + ' ' + L('imported', 'import ho gaya'),
          html:
            '<div style="text-align:left;font-size:13px;line-height:1.75">' +
            L('Rows parsed', 'Rows parse hui') + ': <b>' + res.rowsParsed + '</b><br>' +
            (res.isStock
              ? L('Items in table now', 'Table mein ab items') + ': <b>' + res.rowsWritten + '</b><br>' +
                (res.note ? '<span style="color:var(--muted)">' + fmtDatesInStr(res.note) + '</span><br>' : '')
              : L('Blank dates filled', 'Khaali dates bhari gayi') + ': <b>' + res.blankDatesFilled + '</b><br>' +
                L('Date format detected', 'Date format pehchana gaya') + ': <b>' + res.dateFormat + '</b><br>' +
                L('Date range kept', 'Date range rakha gaya') + ': <b>' + fmtDatesInStr(res.dateRange) + '</b><br>' +
                (res.skippedBeforeOpening ? '<b style="color:#b26a00">' + L('Skipped (before opening date)', 'Skip hui (opening date se pehle)') + ': ' + res.skippedBeforeOpening + '</b><br>' : '') +
                L('Ledger rows added', 'Ledger mein rows judi') + ': <b>' + res.rowsAdded + '</b><br>' +
                L('Old rows pruned (past retention)', 'Purani rows hati (retention se bahar)') + ': <b>' + res.rowsRemoved + '</b><br>') +
            L('Recent ledger rows (Txn)', 'Haal ki ledger rows (Txn)') + ': <b>' + res.ledgerTotal + '</b><br>' +
            L('Items total', 'Kul Items') + ': <b>' + res.items + '</b><br>' +
            L('Unmatched / errors', 'Gadbadi / errors') + ': <b>' + res.unmatchedCount + '</b>' + errHtml +
            (type === 'Sales Return' ? '<br><br><b style="color:#c62828">' + L('Check the date range shows the right month, not Jan/Feb.', 'Check karo date range sahi mahine ka hai, Jan/Feb nahi.') + '</b>' : '') +
            '</div>',
        });
        setText('');
        loadHistory();
        onImported && onImported();
      })
      .catch(e => { setBusy(false); Swal.fire({ icon: 'error', title: L('Import failed', 'Import Fail Ho Gaya'), text: e.message || String(e) }); });
  }

  function undoLast() {
    Swal.fire({
      icon: 'warning', title: L('Undo the last import?', 'Aakhri Import Undo Karein?'),
      text: L('This reverses the most recent Purchase / Sales / Return import and removes its rows. It only works while those rows are still within the retention window.',
              'Ye sabse aakhri Purchase / Sales / Return import ko wapas palat dega aur uski rows hata dega. Ye sirf tab kaam karega jab tak wo rows retention window mein hain.'),
      showCancelButton: true, confirmButtonText: L('Undo it', 'Undo Karo'), confirmButtonColor: '#c62828', cancelButtonText: L('Cancel', 'Cancel'),
    }).then(r => {
      if (!r.isConfirmed) return;
      Swal.fire({ title: L('Undoing…', 'Undo Ho Raha Hai…'), allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      authed('undoLastImport', [], 180000)
        .then(res => {
          if (res && res.authError) { Swal.close(); onAuthError && onAuthError(); return; }
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not undo', 'Undo Nahi Ho Paya'), text: (res && res.message) || '' }); return; }
          Swal.fire({ icon: 'success', title: L('Undone', 'Undo Ho Gaya'), text: res.type + ' ' + L('import reversed', 'import palat diya gaya') + ' (' + res.rows + ' rows).' });
          loadHistory();
          onImported && onImported();
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Could not undo', 'Undo Nahi Ho Paya'), text: e.message || String(e) }));
    });
  }

  return (
    <>
    <div className="panel import-box">
      <h2>{L('Import Data', 'Data Daalo')} <small>· {L('paste an export straight from Busy / Excel', 'Busy / Excel se export seedha paste karo')}</small></h2>
      <div className="row">
        <div>
          <label style={{ fontSize: 11, color: 'var(--muted)', display: 'block', marginBottom: 3, fontWeight: 600 }}>{L('Export type', 'Kis Type Ka Data')}</label>
          <select value={type} onChange={e => setType(e.target.value)} style={{ padding: '9px 12px', borderRadius: 8, border: '1px solid var(--border)', fontSize: 14 }}>
            {IMPORT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <button className="btn-primary" onClick={() => run(false)} disabled={busy}>
          {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> {L('Processing…', 'Chal Raha Hai…')}</> : <><i className="fa-solid fa-gears"></i> {L('Process', 'Chalu Karo')}</>}
        </button>
        <span className="hint">{lines > 1 ? lines.toLocaleString('en-IN') + ' ' + L('lines pasted', 'lines paste hui') : ''}</span>
      </div>

      <textarea value={text} onChange={e => setText(e.target.value)} disabled={busy}
        placeholder={"Paste the Busy export here.\nCopy the whole thing (including the top lines like “List of … Vouchers” and “From 01-08-2026 to 31-08-2026” — the parser skips them).\nColumns are tab-separated, rows on new lines."} />

      <div className="hint">
        {lang === 'hi' ? (
          <>
            <b>Tareeka:</b> pehle ek baar <b>Stock</b> paste karo — puchega ye balance kis date ka hai. Uske baad us date ya baad ki
            <b> Purchase</b> / <b>Sales</b> / <b>Return</b> import karo (pehle pichhle mahino ka daal do, phir har hafte). Current stock aise chalta hai:
            <i> opening + kharid − bikri − purchase return + sale return</i>. Opening date se pehle ki rows apne aap skip ho jaati hain.
            <br /><b>Safety:</b> jo span ek baar import ho chuka (same type, overlapping dates), wo dobara reject ho jayega — double counting nahi hogi.
            Galat file paste ho gayi to neeche <b>Undo last import</b> use karo.
            Dates <i>From … to …</i> line se apne aap detect hoti hain (Sales Return = MM-DD, baaki DD-MM). Pura mahina bhi chalega; sirf bahut zyada bada ho to Busy se chhota date-range nikaalo.
          </>
        ) : (
          <>
            <b>Order:</b> first paste <b>Stock</b> once — you'll be asked which date that balance is as of. Then import
            every <b>Purchase</b> / <b>Sales</b> / <b>Return</b> dated on or after that date (back-fill the last few months first,
            then keep going each week). Current stock is maintained as
            <i> opening + purchases − sales − purchase&nbsp;return + sale&nbsp;return</i>. Rows dated before the opening date are skipped.
            <br /><b>Safety:</b> a span you already imported (same type, overlapping dates) is rejected — no double counting.
            Use <b>Undo last import</b> below if you pasted the wrong file.
            Dates auto-detected from the <i>From … to …</i> line (Sales Return defaults to MM-DD, the rest DD-MM). A full month is fine; only if it's truly huge, export a shorter date range from Busy.
          </>
        )}
      </div>
    </div>

    <div className="panel">
      <h2>{L('Recent imports', 'Pichhle Imports')}
        <small> · {L('last 15', 'aakhri 15')}</small>
        {isAdmin && (
          <button className="logout" style={{ float: 'right' }} onClick={undoLast}>
            <i className="fa-solid fa-rotate-left"></i> {L('Undo last import', 'Aakhri Import Undo Karo')}
          </button>
        )}
      </h2>
      {!history && <div className="hint">{L('Loading…', 'Load ho raha hai…')}</div>}
      {history && history.length === 0 && <div className="hint">{L('No imports yet.', 'Abhi tak koi import nahi.')}</div>}
      {history && history.length > 0 && (
        <div className="tbl-scroll">
          <table className="ntable">
            <thead><tr><th>{L('When', 'Kab')}</th><th>{L('Type', 'Type')}</th><th>{L('Span', 'Span')}</th><th className="num">{L('Rows', 'Rows')}</th><th>{L('By', 'Kisne')}</th><th>{L('Note', 'Note')}</th></tr></thead>
            <tbody>
              {history.map((h, i) => (
                <tr key={i}>
                  <td data-label={L('When', 'Kab')}>{fmtDateTime(h.at)}</td>
                  <td data-label={L('Type', 'Type')}>{h.type}</td>
                  <td data-label={L('Span', 'Span')}>{h.from ? fmtDate(h.from) + ' → ' + fmtDate(h.to) : '—'}</td>
                  <td data-label={L('Rows', 'Rows')} className="num">{num(h.rows)}</td>
                  <td data-label={L('By', 'Kisne')}>{h.by}</td>
                  <td data-label={L('Note', 'Note')}>{h.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
    </>
  );
}

/* ================= Users (admin only — create logins, roles, permissions, reset passwords) ================= */

// Must match the `key`s in Code.gs's PERMISSION_DEFS exactly. Only meaningful for role='staff' —
// admin always has full access and never uses this list.
const PERMISSION_DEFS = [
  { key: 'view_dashboard', en: 'View Dashboard', hi: 'Dashboard Dekho' },
  { key: 'view_report',    en: 'View Full Report', hi: 'Poori Report Dekho' },
  { key: 'view_unmatched', en: 'View Unmatched', hi: 'Gadbadi Dekho' },
  { key: 'import_data',    en: 'Import Data', hi: 'Data Import Karo' },
  { key: 'cancel_bills',   en: 'Cancel / Restore Bills', hi: 'Bill Cancel / Restore Karo' },
];
const DEFAULT_STAFF_PERMS = ['view_dashboard', 'import_data'];

function UsersView() {
  const { L } = useLang();
  const [users, setUsers] = useState(null);
  const [me, setMe] = useState('');
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  const [newUsername, setNewUsername] = useState('');
  const [newDisplayName, setNewDisplayName] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [newRole, setNewRole] = useState('staff');
  const [newPerms, setNewPerms] = useState(DEFAULT_STAFF_PERMS.slice());

  function load() {
    setErr(null);
    authed('listUsers', [], 60000)
      .then(res => {
        if (res && res.authError) return;
        if (!res || !res.ok) { setErr((res && res.message) || 'Could not load users.'); return; }
        setUsers(res.users);
        setMe(res.you || '');
      })
      .catch(e => setErr(e.message || String(e)));
  }
  useEffect(() => { load(); }, []);

  function toggleNewPerm(key) {
    setNewPerms(p => p.indexOf(key) > -1 ? p.filter(x => x !== key) : [...p, key]);
  }

  function addUser(e) {
    e.preventDefault();
    const uname = newUsername.trim();
    if (!uname || !newPassword) { Swal.fire({ icon: 'info', title: L('Username and password are required', 'Username aur password zaroori hai') }); return; }
    setBusy(true);
    authed('createUserFromApp', [uname, newPassword, newRole, newDisplayName.trim(), newPerms], 60000)
      .then(res => {
        setBusy(false);
        if (res && res.authError) return;
        if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not save', 'Save Nahi Hua'), text: (res && res.message) || '' }); return; }
        Swal.fire({ icon: 'success', title: res.updated ? L('User updated', 'User Update Ho Gaya') : L('User created', 'User Ban Gaya') });
        setNewUsername(''); setNewDisplayName(''); setNewPassword(''); setNewRole('staff'); setNewPerms(DEFAULT_STAFF_PERMS.slice());
        load();
      })
      .catch(e => { setBusy(false); Swal.fire({ icon: 'error', title: L('Could not save', 'Save Nahi Hua'), text: e.message || String(e) }); });
  }

  function editPermissions(u) {
    const boxesHtml = PERMISSION_DEFS.map(p =>
      '<label style="display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;text-align:left;cursor:pointer">' +
        '<input type="checkbox" id="perm_' + p.key + '" style="width:15px;height:15px" ' + (u.permissions.indexOf(p.key) > -1 ? 'checked' : '') + '> ' +
        L(p.en, p.hi) +
      '</label>'
    ).join('');
    Swal.fire({
      title: L('Permissions for "' + u.username + '"', '"' + u.username + '" ke liye permissions'),
      html: '<div style="text-align:left">' + boxesHtml + '</div>',
      showCancelButton: true, confirmButtonText: L('Save', 'Save Karo'), cancelButtonText: L('Cancel', 'Cancel'),
      preConfirm: () => PERMISSION_DEFS.filter(p => document.getElementById('perm_' + p.key).checked).map(p => p.key),
    }).then(r => {
      if (!r.isConfirmed) return;
      authed('setUserPermissions', [u.username, r.value], 60000)
        .then(res => {
          if (res && res.authError) return;
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not save', 'Save Nahi Hua'), text: (res && res.message) || '' }); return; }
          load();
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Could not save', 'Save Nahi Hua'), text: e.message || String(e) }));
    });
  }

  function changeRole(u, role) {
    if (role === u.role) return;
    Swal.fire({
      icon: 'warning', title: L('Change role?', 'Role Badlein?'),
      text: L('Make "' + u.username + '" ' + (role === 'admin' ? 'an admin' : 'staff') + '?',
              '"' + u.username + '" ko ' + role + ' bana dein?'),
      showCancelButton: true, confirmButtonText: L('Yes', 'Haan'), cancelButtonText: L('No', 'Nahi'),
    }).then(r => {
      if (!r.isConfirmed) { load(); return; } // snap the <select> back if cancelled
      authed('setUserRole', [u.username, role], 60000)
        .then(res => {
          if (res && res.authError) return;
          if (!res || !res.ok) Swal.fire({ icon: 'error', title: L('Could not change role', 'Role Change Nahi Hua'), text: (res && res.message) || '' });
          load();
        })
        .catch(e => { Swal.fire({ icon: 'error', title: L('Could not change role', 'Role Change Nahi Hua'), text: e.message || String(e) }); load(); });
    });
  }

  function toggleActive(u) {
    const goingActive = !u.active;
    Swal.fire({
      icon: 'warning', title: goingActive ? L('Activate this user?', 'User Activate Karein?') : L('Deactivate this user?', 'User Deactivate Karein?'),
      text: u.username, showCancelButton: true, confirmButtonColor: goingActive ? undefined : '#c62828',
      confirmButtonText: L('Yes', 'Haan'), cancelButtonText: L('No', 'Nahi'),
    }).then(r => {
      if (!r.isConfirmed) return;
      authed('setUserActive', [u.username, goingActive], 60000)
        .then(res => {
          if (res && res.authError) return;
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not change', 'Change Nahi Hua'), text: (res && res.message) || '' }); return; }
          load();
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Could not change', 'Change Nahi Hua'), text: e.message || String(e) }));
    });
  }

  function resetPassword(u) {
    Swal.fire({
      title: L('New password for "' + u.username + '"', '"' + u.username + '" ke liye naya password'),
      input: 'text', inputPlaceholder: L('New password (min 4 characters)', 'Naya password (kam se kam 4 characters)'),
      showCancelButton: true, confirmButtonText: L('Set password', 'Password Set Karo'), cancelButtonText: L('Cancel', 'Cancel'),
      preConfirm: v => { if (!v || String(v).length < 4) { Swal.showValidationMessage(L('At least 4 characters', 'Kam se kam 4 characters')); return false; } return v; },
    }).then(r => {
      if (!r.isConfirmed) return;
      authed('adminResetPassword', [u.username, r.value], 60000)
        .then(res => {
          if (res && res.authError) return;
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not reset', 'Reset Nahi Hua'), text: (res && res.message) || '' }); return; }
          Swal.fire({ icon: 'success', title: L('Password changed', 'Password Badal Gaya'),
            text: L('They will need to log in again with the new password.', 'Unhe naye password se dobara login karna hoga.') });
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Could not reset', 'Reset Nahi Hua'), text: e.message || String(e) }));
    });
  }

  const columns = [
    { key: 'username', label: L('Username', 'Username') },
    { key: 'display_name', label: L('Display Name', 'Naam') },
    { key: 'role', label: L('Role', 'Role'), sortValue: r => r.role,
      render: r => (
        <select value={r.role} onChange={e => changeRole(r, e.target.value)}
          style={{ padding: '5px 8px', borderRadius: 6, border: '1px solid var(--border)', fontSize: 12.5 }}>
          <option value="admin">admin</option>
          <option value="staff">staff</option>
        </select>
      ) },
    { key: 'active', label: L('Status', 'Status'), sortValue: r => r.active ? 1 : 0,
      render: r => <span className={'pill ' + (r.active ? 'OK' : 'DEAD')}>{r.active ? L('ACTIVE', 'ACTIVE') : L('DISABLED', 'DISABLED')}</span>,
      exportValue: r => r.active ? 'ACTIVE' : 'DISABLED' },
    { key: 'permissions', label: L('Permissions', 'Permissions'), sortable: false,
      render: r => r.role === 'admin'
        ? <span className="hint" style={{ margin: 0 }}>{L('all (admin)', 'sab kuch (admin)')}</span>
        : <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 12, color: 'var(--muted)' }}>
              {r.permissions.length ? r.permissions.join(', ') : L('none', 'kuch nahi')}
            </span>
            <button type="button" className="btn-sm" onClick={e => { e.stopPropagation(); editPermissions(r); }}>
              <i className="fa-solid fa-pen"></i> {L('Edit', 'Edit')}
            </button>
          </div>,
      exportValue: r => r.role === 'admin' ? 'ALL' : r.permissions.join(', ') },
    { key: '_actions', label: L('Actions', 'Actions'), sortable: false, filterable: false,
      render: r => (
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <button type="button" className="btn-sm" onClick={e => { e.stopPropagation(); resetPassword(r); }}>
            <i className="fa-solid fa-key"></i> {L('Reset password', 'Password Reset')}
          </button>
          {r.username === me
            ? <span className="hint" style={{ margin: 0 }}>{L('(you)', '(aap)')}</span>
            : <button type="button" className={r.active ? 'btn-danger-sm' : 'btn-sm'} onClick={e => { e.stopPropagation(); toggleActive(r); }}>
                <i className={'fa-solid ' + (r.active ? 'fa-user-slash' : 'fa-user-check')}></i>
                {r.active ? L('Deactivate', 'Deactivate') : L('Activate', 'Activate')}
              </button>}
        </div>
      ) },
  ];

  return (
    <>
      <div className="panel">
        <h2>{L('Add / update a user', 'User Add / Update Karo')} <small>· {L('create staff logins here — no need for the Apps Script editor', 'yahin se staff ke login banao — Apps Script editor ki zaroorat nahi')}</small></h2>
        <form onSubmit={addUser}>
          <div className="form-grid">
            <div>
              <label>{L('Username', 'Username')}</label>
              <input value={newUsername} onChange={e => setNewUsername(e.target.value)} placeholder="staff2" />
            </div>
            <div>
              <label>{L('Display name', 'Naam')}</label>
              <input value={newDisplayName} onChange={e => setNewDisplayName(e.target.value)} placeholder={L('e.g. Ramesh', 'jaise Ramesh')} />
            </div>
            <div>
              <label>{L('Password', 'Password')}</label>
              <input type="text" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder={L('min 4 characters', 'kam se kam 4 characters')} />
            </div>
            <div>
              <label>{L('Role', 'Role')}</label>
              <select value={newRole} onChange={e => setNewRole(e.target.value)} style={{ width: '100%', padding: '10px 12px', borderRadius: 9, border: '1px solid var(--border)', fontSize: 14 }}>
                <option value="staff">staff</option>
                <option value="admin">admin</option>
              </select>
            </div>
          </div>
          {newRole === 'staff' && (
            <div style={{ background: '#f6f8fc', border: '1px solid var(--border)', borderRadius: 10, padding: '12px 14px', marginBottom: 16 }}>
              <label style={{ fontSize: 12, color: 'var(--muted)', fontWeight: 600, display: 'block', marginBottom: 8 }}>
                {L('What can this staff member do?', 'Ye staff member kya kar sakta hai?')}
              </label>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px 18px' }}>
                {PERMISSION_DEFS.map(p => (
                  <label key={p.key} style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 13, cursor: 'pointer' }}>
                    <input type="checkbox" checked={newPerms.indexOf(p.key) > -1} onChange={() => toggleNewPerm(p.key)}
                      style={{ width: 15, height: 15 }} />
                    {L(p.en, p.hi)}
                  </label>
                ))}
              </div>
            </div>
          )}
          <button type="submit" className="btn-primary" disabled={busy}>
            {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> {L('Saving…', 'Save Ho Raha Hai…')}</> : <><i className="fa-solid fa-user-plus"></i> {L('Save user', 'User Save Karo')}</>}
          </button>
        </form>
        <div className="hint">
          {L('Typing the SAME username as an existing user updates it (password/role/name/permissions) instead of creating a new one. Admin sees and can do everything; staff only gets the boxes ticked above (change any time from the table below).',
             'Agar existing username hi dubara type karoge to wo update ho jayega (password/role/naam/permissions) — naya nahi banega. Admin sab kuch dekh/kar sakta hai; staff ko sirf upar tick ki hui cheezein milengi (neeche table se kabhi bhi badal sakte ho).')}
        </div>
      </div>

      <div className="panel">
        <h2>{L('All users', 'Sabhi Users')}</h2>
        {err && <div className="alert err"><i className="fa-solid fa-circle-exclamation"></i> {err}<button onClick={load}>{L('Retry', 'Dobara Try Karo')}</button></div>}
        {!err && !users && <div className="hint">{L('Loading…', 'Load ho raha hai…')}</div>}
        {!err && users && (
          <NativeTable columns={columns} rows={users} pageSize={25}
            defaultSort={{ key: 'username', dir: 'asc' }}
            emptyText={L('No users.', 'Koi user nahi.')} />
        )}
      </div>
    </>
  );
}

/* ================= Settings (admin only) ================= */

function SettingsView({ onAuthError }) {
  const { L } = useLang();
  const [s, setS] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    authed('getAppSettings', [], 60000)
      .then(r => {
        if (r && r.authError) { onAuthError && onAuthError(); return; }
        if (r && r.ok) setS(r); else setErr((r && r.message) || 'Could not load settings.');
      })
      .catch(e => setErr(e.message || String(e)));
  }, []);

  if (err) return <div className="panel"><div className="alert err"><i className="fa-solid fa-circle-exclamation"></i> {err}</div></div>;
  if (!s) return <Loader en="Loading settings…" hi="Settings load ho rahi hain…" />;

  function set(k, v) { setS(p => ({ ...p, [k]: v })); }

  function save() {
    setBusy(true);
    authed('saveSettings', [{
      aging_window_days: s.aging_window_days,
      dead_stock_min_qty: s.dead_stock_min_qty,
      sell_through_threshold_pct: s.sell_through_threshold_pct,
    }], 180000)
      .then(r => {
        setBusy(false);
        if (r && r.authError) { onAuthError && onAuthError(); return; }
        if (r && r.ok) Swal.fire({ icon: 'success', title: L('Saved', 'Save Ho Gaya') });
        else Swal.fire({ icon: 'error', title: L('Save failed', 'Save Nahi Hua'), text: (r && r.message) || '' });
      })
      .catch(e => { setBusy(false); Swal.fire({ icon: 'error', title: L('Save failed', 'Save Nahi Hua'), text: e.message || String(e) }); });
  }

  function resetAll() {
    Swal.fire({
      icon: 'warning', title: L('Reset ALL data?', 'Sab Data Reset Karein?'),
      html: '<div style="text-align:left;font-size:13px;line-height:1.7">' +
            L('This empties <b>Items, Txn, Salesmen, SalesmanBuys, Imports, Unmatched</b> and <b>CancelledBills</b>.<br>Logins and these settings are kept.<br><br>Type <b>RESET</b> to confirm:',
              'Isse <b>Items, Txn, Salesmen, SalesmanBuys, Imports, Unmatched</b> aur <b>CancelledBills</b> khaali ho jayenge.<br>Logins aur ye settings bachi rahengi.<br><br>Confirm karne ke liye <b>RESET</b> type karo:') +
            '</div>',
      input: 'text', inputPlaceholder: 'RESET',
      showCancelButton: true, confirmButtonText: L('Wipe everything', 'Sab Mitao'), confirmButtonColor: '#c62828', cancelButtonText: L('Cancel', 'Cancel'),
      preConfirm: v => { if (String(v).trim() !== 'RESET') { Swal.showValidationMessage(L('Type RESET in capitals', 'RESET (capitals mein) type karo')); return false; } return v; },
    }).then(r => {
      if (!r.isConfirmed) return;
      Swal.fire({ title: L('Wiping…', 'Mitaya Ja Raha Hai…'), allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      authed('resetAllData', ['RESET'], 120000)
        .then(res => {
          if (res && res.authError) { Swal.close(); onAuthError && onAuthError(); return; }
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Reset failed', 'Reset Nahi Hua'), text: (res && res.message) || '' }); return; }
          Swal.fire({ icon: 'success', title: L('All data cleared', 'Sab Data Saaf Ho Gaya'), text: L('Paste your opening Stock to start again.', 'Dobara shuru karne ke liye opening Stock paste karo.') });
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Reset failed', 'Reset Nahi Hua'), text: e.message || String(e) }));
    });
  }

  return (
    <>
    <div className="panel">
      <h2>{L('Settings', 'Settings')} <small>· {L('thresholds that drive the DEAD / STALE / SLOW status', 'DEAD / STALE / SLOW status ke thresholds')}</small></h2>
      <div className="form-grid">
        <div>
          <label>{L('Aging window (days)', 'Aging Window (Din)')}</label>
          <input type="number" value={s.aging_window_days} onChange={e => set('aging_window_days', e.target.value)} />
          <div className="fhint">{L('Days since last purchase before an item can be flagged DEAD.', 'Kharid ke kitne din baad item DEAD flag ho sakta hai.')}</div>
        </div>
        <div>
          <label>{L('Dead-stock min qty', 'Dead Ke Liye Min Qty')}</label>
          <input type="number" value={s.dead_stock_min_qty} onChange={e => set('dead_stock_min_qty', e.target.value)} />
          <div className="fhint">{L('Net purchased (lifetime) must be at least this to count as DEAD (ignore tiny lots).', 'DEAD ginne ke liye kul kharid kam se kam itni honi chahiye (chhoti lots ignore).')}</div>
        </div>
        <div>
          <label>{L('Sell-through threshold (%)', 'Sell-through Threshold (%)')}</label>
          <input type="number" value={s.sell_through_threshold_pct} onChange={e => set('sell_through_threshold_pct', e.target.value)} />
          <div className="fhint">{L('Below this sell-through %, an item is DEAD / SLOW.', 'Is % se kam sell-through ho to item DEAD / SLOW hai.')}</div>
        </div>
      </div>
      <button className="btn-primary" onClick={save} disabled={busy}>
        {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> {L('Saving…', 'Save Ho Raha Hai…')}</> : <><i className="fa-solid fa-floppy-disk"></i> {L('Save', 'Save Karo')}</>}
      </button>
      <div className="hint">
        {L('Thresholds apply on the next dashboard load (everything is computed live — no rebuild).',
           'Thresholds agli dashboard load pe lagu ho jaate hain (sab kuch live compute hota hai — rebuild nahi chahiye).')}{' '}
        {L('Opening stock is as of', 'Opening stock is date ka hai')} <b>{fmtDate(s.opening_stock_as_of) || L('not set yet', 'abhi set nahi hai')}</b> —{' '}
        {L('transactions dated before that are skipped on import.', 'us se pehle ki transactions import mein skip ho jaati hain.')}{' '}
        {L('Transaction detail is kept for', 'Transaction detail rakha jaata hai')} <b>{s.txn_retention_days} {L('days', 'din')}</b>{' '}
        {L('(the txn_retention_days key in the Settings tab); the aging window can\'t exceed that.',
           '(Settings tab mein txn_retention_days key) — aging window isse zyada nahi ho sakta.')}
      </div>
    </div>

    <div className="panel" style={{ borderLeft: '4px solid var(--dead)' }}>
      <h2 style={{ color: 'var(--dead)' }}><i className="fa-solid fa-triangle-exclamation"></i> {L('Danger zone', 'Khatarnak Zone')}</h2>
      <div className="hint" style={{ marginBottom: 12 }}>
        {L('Start the whole system from zero — clears every item, transaction and salesperson record. Logins stay. There is no undo. You will paste opening Stock again afterwards.',
           'Poora system zero se shuru karo — har item, transaction aur salesman record mit jayega. Logins bachi rahengi. Isko undo nahi kar sakte. Baad mein opening Stock dobara paste karna padega.')}
      </div>
      <button className="logout" style={{ padding: '11px 18px', fontSize: 14 }} onClick={resetAll}>
        <i className="fa-solid fa-trash"></i> {L('Reset all data', 'Sab Data Reset Karo')}
      </button>
    </div>
    </>
  );
}

/* ================= Login ================= */

function Login({ onLogin }) {
  const { L } = useLang();
  const [u, setU] = useState('');
  const [p, setP] = useState('');
  const [busy, setBusy] = useState(false);

  function submit(e) {
    e.preventDefault();
    if (!u || !p) return;
    setBusy(true);
    callServer('login', [u, p], 60000)
      .then(res => {
        setBusy(false);
        if (res && res.ok) {
          onLogin({ token: res.token, role: res.role, display_name: res.display_name, username: res.username, permissions: res.permissions || [] });
        } else {
          Swal.fire({ icon: 'error', title: L('Sign in failed', 'Login Nahi Hua'), text: (res && res.message) || L('Wrong username or password.', 'Galat username ya password.') });
        }
      })
      .catch(err => { setBusy(false); Swal.fire({ icon: 'error', title: L('Sign in failed', 'Login Nahi Hua'), text: err.message || String(err) }); });
  }

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <LangToggle />
        <div className="logo"><i className="fa-solid fa-shirt"></i></div>
        <h1>Paris Fashion</h1>
        <p className="tag">{L('Dead-Stock Tracker — sign in', 'Dead-Stock Tracker — login karo')}</p>
        <label>{L('Username', 'Username')}</label>
        <input value={u} onChange={e => setU(e.target.value)} autoFocus autoComplete="username" />
        <label>{L('Password', 'Password')}</label>
        <input type="password" value={p} onChange={e => setP(e.target.value)} autoComplete="current-password" />
        <button type="submit" disabled={busy}>
          {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> {L('Signing in…', 'Login Ho Raha Hai…')}</> : L('Sign in', 'Login Karo')}
        </button>
      </form>
    </div>
  );
}

/* ================= Shell (sidebar + topbar + views) ================= */

function Shell({ auth, onLogout }) {
  const { L } = useLang();
  const navItems = useMemo(() => NAV.filter(n =>
    n.roles.indexOf(auth.role) > -1 &&
    (!n.perm || auth.role === 'admin' || (auth.permissions || []).indexOf(n.perm) > -1)
  ), [auth.role, auth.permissions]);
  const [view, setView] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [windowDays, setWindowDays] = useState(16);
  const [reportFilter, setReportFilter] = useState(null);

  // if a view isn't allowed for this role, snap back to Dashboard
  useEffect(() => { if (navItems.findIndex(n => n.id === view) < 0) setView('dashboard'); }, [view, navItems]);

  function load(w) {
    setLoading(true); setErr(null);
    authed('getDashboardData', [w], 240000)
      .then(d => {
        if (d && d.authError) { onLogout(); return; }
        if (!d || d.ok === false) {
          setErr((d && d.message) ||
            L('The server returned nothing. This usually means the Stock sheet is very large — press Refresh to retry, or import fewer rows.',
              'Server se kuch nahi aaya. Aksar iska matlab hai Stock bahut bada hai — Refresh dabao ya kam rows import karo.'));
          setLoading(false);
          return;
        }
        setData(d); setLoading(false);
      })
      .catch(e => { setErr(e.message || String(e)); setLoading(false); });
  }
  useEffect(() => { load(windowDays); }, []);

  function changeWindow(v) {
    if (v === 'custom') {
      Swal.fire({ title: L('Custom window (days)', 'Apna Window (Din)'), input: 'number', inputValue: windowDays, showCancelButton: true })
        .then(r => { if (r.isConfirmed && r.value) { const n = parseInt(r.value, 10); setWindowDays(n); load(n); } });
      return;
    }
    const n = parseInt(v, 10); setWindowDays(n); load(n);
  }

  function go(id) { setReportFilter(null); setView(id); setSidebarOpen(false); }

  /** Used by clickable dashboard cards — jump to a view, pre-filtered (e.g. Full Report -> DEAD only).
      Full Report unmounts whenever this isn't the active view, so a fresh mount always picks up
      whatever reportFilter was set right before navigating (see FullReportView's initialFilter). */
  function goto(id, filter) {
    setReportFilter(filter || null);
    setView(id); setSidebarOpen(false);
  }

  const stdWindow = [30, 16, 10].indexOf(windowDays) > -1;
  const activeNav = navItems.find(n => n.id === view);
  const pageTitle = activeNav ? L(activeNav.en, activeNav.hi) : L('Dashboard', 'Dashboard');
  const needsData = view !== 'import' && view !== 'settings' && view !== 'fullreport' && view !== 'cancelled' && view !== 'users';

  return (
    <div className="shell">
      <aside className={'sidebar' + (sidebarOpen ? ' open' : '')}>
        <div className="brand"><span className="logo"><i className="fa-solid fa-shirt"></i></span> Paris Fashion IMS</div>
        <nav>
          {navItems.map(n => (
            <button key={n.id} className={view === n.id ? 'active' : ''} onClick={() => go(n.id)}>
              <i className={'fa-solid ' + n.icon}></i> {L(n.en, n.hi)}
            </button>
          ))}
        </nav>
        <div className="foot">{auth.display_name} · {auth.role}<br />v3 · lean incremental ledger</div>
      </aside>
      <div className={'backdrop' + (sidebarOpen ? ' show' : '')} onClick={() => setSidebarOpen(false)}></div>

      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={() => setSidebarOpen(o => !o)}><i className="fa-solid fa-bars"></i></button>
          <h2>{pageTitle}</h2>
          <LangToggle />
          {needsData && (
            <select value={stdWindow ? windowDays : 'custom'} onChange={e => changeWindow(e.target.value)} title="Aging window">
              <option value="30">{L('Last 30 days', 'Pichhle 30 din')}</option>
              <option value="16">{L('Last 16 days', 'Pichhle 16 din')}</option>
              <option value="10">{L('Last 10 days', 'Pichhle 10 din')}</option>
              <option value="custom">{L('Custom…', 'Apna number…')}{stdWindow ? '' : ` (${windowDays})`}</option>
            </select>
          )}
          {needsData && (
            <button className="icon-btn" onClick={() => load(windowDays)} title="Reload"><i className="fa-solid fa-rotate"></i></button>
          )}
          <div className="userchip">
            <span>{auth.display_name}</span>
            <span className="role">{auth.role}</span>
          </div>
          <button className="logout" onClick={onLogout}><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>

        <div className="content">
          {err && (
            <div className="alert err">
              <i className="fa-solid fa-circle-exclamation"></i> {err}
              <button onClick={() => load(windowDays)}>{L('Retry', 'Dobara Try Karo')}</button>
            </div>
          )}

          {view === 'import' && (
            <ErrorBoundary label="Import Data">
              <ImportData onImported={() => load(windowDays)} onAuthError={onLogout} isAdmin={auth.role === 'admin'} />
            </ErrorBoundary>
          )}

          {view === 'settings' && (
            <ErrorBoundary label="Settings">
              <SettingsView onAuthError={onLogout} />
            </ErrorBoundary>
          )}

          {view === 'fullreport' && (
            <ErrorBoundary label="Full Report">
              <FullReportView initialFilter={reportFilter} />
            </ErrorBoundary>
          )}

          {view === 'cancelled' && (
            <ErrorBoundary label="Cancelled Bills">
              <CancelledBillsView />
            </ErrorBoundary>
          )}

          {view === 'users' && (
            <ErrorBoundary label="Users">
              <UsersView />
            </ErrorBoundary>
          )}

          {needsData && view !== 'settings' && loading && (
            <Loader en="Computing…" hi="Hisaab lagaya ja raha hai…" />
          )}

          {needsData && view !== 'settings' && !loading && data && (
            <ErrorBoundary label="This view">
              {view === 'dashboard' && <DashboardHome data={data} goto={goto} role={auth.role} />}
              {view === 'unmatched' && <UnmatchedView rows={data.unmatched} />}
            </ErrorBoundary>
          )}

          {needsData && view !== 'settings' && !loading && !data && !err && (
            <div className="panel">{L('No data yet. Go to Import Data and paste your Busy exports.', 'Abhi tak koi data nahi. Import Data mein jaake Busy ka export paste karo.')}</div>
          )}
        </div>

        <footer>{L('Paris Fashion IMS · dead-stock & salesperson accountability · thresholds in Settings',
                    'Paris Fashion IMS · dead-stock aur salesman accountability · thresholds Settings mein')}</footer>
      </div>
    </div>
  );
}

/* ================= App (auth gate) ================= */

function App() {
  const [auth, setAuth] = useState(_initAuth);

  function onLogin(a) { writeAuth(a); setAuth(a); }
  function onLogout() {
    const t = AUTH_TOKEN;
    writeAuth(null); setAuth(null);
    if (t) callServer('logout', [t], 20000).catch(() => {});
  }

  if (!auth || !auth.token) return <Login onLogin={onLogin} />;
  return <Shell auth={auth} onLogout={onLogout} />;
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <ErrorBoundary label="The app"><LangProvider><App /></LangProvider></ErrorBoundary>
  );
} catch (e) {
  document.getElementById('root').innerHTML =
    '<div style="padding:24px;color:#c62828;font-family:sans-serif">Failed to start: ' + ((e && e.message) || e) + '</div>';
}
</script>
</body>
</html>
