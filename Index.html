<!-- ============================================================================================
     PARIS FASHION — DEAD STOCK TRACKER  (ERP admin panel, served by Code.gs doGet())
     React 18 + Babel (in-browser) · Chart.js 4.4.0 · SweetAlert2 11 · Font Awesome 6.5.1
     NO jQuery / NO DataTables — native React tables. Sidebar shell · login + roles · KPI dashboard.
     navy theme · CSS variables · ₹ Indian format · mobile-first · error boundary (never blanks).
     Bilingual UI (English / Hinglish) via a top-bar language toggle — see LangCtx / useLang() / L().
     ============================================================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris Fashion — Dead Stock Tracker</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.1/sweetalert2.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.1/sweetalert2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --navy-900:#0b1e3f; --navy-800:#12294f; --navy-700:#1b3a6b; --navy-600:#2a4d86;
    --navy-500:#3a63a8; --accent:#4f8cff; --bg:#eef1f7; --card:#ffffff;
    --text:#1a2438; --muted:#6b7890; --border:#e2e7f0;
    --dead:#c62828; --dead-bg:#fdecec; --negative:#b26a00; --negative-bg:#fff4e2;
    --stale:#ef6c00; --stale-bg:#fff3e6; --slow:#f9a825; --slow-bg:#fff9e6;
    --selling:#2e7d32; --selling-bg:#e9f6ea; --cleared:#607d8b; --cleared-bg:#eceff1;
    --returncand:#6a1b9a; --returncand-bg:#f3e5f5; --ok:#2e7d32; --ok-bg:#e9f6ea;
    --shadow:0 1px 3px rgba(11,30,63,.10),0 1px 2px rgba(11,30,63,.06);
    --sidebar-w:242px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

  /* ---------- language toggle ---------- */
  .lang-toggle { display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; flex-shrink:0; }
  .lang-toggle button { border:none; background:#fff; color:var(--muted); font-size:11.5px; font-weight:700;
                         padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .lang-toggle button.active { background:var(--navy-700); color:#fff; }
  .login-card .lang-toggle { margin:0 0 18px; width:100%; }
  .login-card .lang-toggle button { flex:1; padding:9px 8px; }

  /* ---------- login ---------- */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center;
                background:radial-gradient(1200px 600px at 20% -10%, var(--navy-600), var(--navy-900)); padding:20px; }
  .login-card { background:#fff; border-radius:16px; padding:34px 30px; width:100%; max-width:380px;
                box-shadow:0 24px 70px rgba(0,0,0,.35); }
  .login-card .logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--navy-700),var(--accent));
                      display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; margin-bottom:16px; }
  .login-card h1 { font-size:19px; margin:0 0 4px; color:var(--navy-800); }
  .login-card p.tag { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .login-card label { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; }
  .login-card input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; margin-bottom:14px; }
  .login-card button[type=submit] { width:100%; background:var(--navy-700); color:#fff; border:none; padding:12px; border-radius:9px;
                       font-size:15px; font-weight:600; cursor:pointer; }
  .login-card button:disabled { opacity:.6; cursor:default; }

  /* ---------- shell ---------- */
  .shell { display:flex; min-height:100vh; }
  .sidebar { width:var(--sidebar-w); background:linear-gradient(180deg,var(--navy-900),#0a1830);
             color:#fff; position:fixed; inset:0 auto 0 0; z-index:60; display:flex; flex-direction:column;
             transition:transform .25s ease; }
  .sidebar .brand { padding:20px 18px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:11px;
                    border-bottom:1px solid rgba(255,255,255,.08); }
  .sidebar .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--navy-600),var(--accent));
                          display:flex; align-items:center; justify-content:center; font-size:14px; }
  .sidebar nav { padding:12px 10px; flex:1; overflow-y:auto; }
  .sidebar nav button { width:100%; text-align:left; background:transparent; border:none; color:rgba(255,255,255,.72);
                        padding:11px 13px; border-radius:9px; font-size:13.5px; cursor:pointer; display:flex; align-items:center;
                        gap:12px; margin-bottom:2px; }
  .sidebar nav button:hover { background:rgba(255,255,255,.08); color:#fff; }
  .sidebar nav button.active { background:var(--accent); color:#fff; font-weight:600; }
  .sidebar nav button i { width:18px; text-align:center; font-size:14px; }
  .sidebar .foot { padding:13px 18px; font-size:11px; color:rgba(255,255,255,.4); border-top:1px solid rgba(255,255,255,.08); }

  .main { margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { background:#fff; border-bottom:1px solid var(--border); padding:11px 20px; display:flex; align-items:center;
            gap:12px; position:sticky; top:0; z-index:40; flex-wrap:wrap; }
  .topbar .hamburger { display:none; background:none; border:none; font-size:18px; color:var(--navy-800); cursor:pointer; }
  .topbar h2 { font-size:16px; margin:0; flex:1; }
  .topbar select, .topbar .icon-btn { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 10px;
                                      font-size:13px; cursor:pointer; }
  .topbar .userchip { text-align:right; font-size:12.5px; line-height:1.25; }
  .topbar .userchip .role { color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.6px; }
  .topbar .logout { background:var(--dead-bg); color:var(--dead); border:none; border-radius:8px; padding:8px 12px;
                    font-size:13px; cursor:pointer; font-weight:600; }
  .content { padding:20px; width:100%; max-width:1240px; }

  .backdrop { display:none; }

  /* ---------- KPI cards ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--card); border-radius:14px; padding:16px; box-shadow:var(--shadow); border-left:4px solid var(--navy-500); }
  .kpi .label { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .kpi .value { font-size:23px; font-weight:700; margin-top:6px; }
  .kpi .sub { font-size:11px; color:var(--muted); margin-top:3px; }
  .kpi.dead { border-left-color:var(--dead); } .kpi.dead .value { color:var(--dead); }
  .kpi.amber { border-left-color:var(--negative); } .kpi.amber .value { color:var(--negative); }
  .kpi.good { border-left-color:var(--selling); } .kpi.good .value { color:var(--selling); }

  .alert { background:#fff8e1; border:1px solid #ffe082; border-radius:12px; padding:12px 14px; margin-bottom:16px;
           display:flex; align-items:center; gap:10px; color:#8a6d00; font-weight:600; flex-wrap:wrap; }
  .alert button { margin-left:auto; background:var(--navy-700); color:#fff; border:none; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .alert.err { background:#fdecec; border-color:#f5c2c2; color:var(--dead); }

  .panel { background:var(--card); border-radius:14px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .panel h2 { font-size:15px; margin:0 0 12px; }
  .panel h2 small { font-weight:400; color:var(--muted); font-size:12px; }

  .chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-box { position:relative; height:300px; }

  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .filters label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.3px; }
  .filters select, .filters input { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:#fff; min-width:130px; }

  /* ---------- multi-select dropdown (checkbox panel) ---------- */
  .msel { position:relative; min-width:150px; }
  .msel-btn { width:100%; text-align:left; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px;
              background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .msel-btn span.txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msel-panel { position:fixed; z-index:1000; background:#fff; border:1px solid var(--border);
                border-radius:10px; box-shadow:0 8px 24px rgba(11,30,63,.18); width:max-content; min-width:200px; max-width:320px;
                max-height:260px; overflow-y:auto; padding:8px; }
  .msel-panel .msel-search { width:100%; padding:6px 8px; margin-bottom:6px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; box-sizing:border-box; }
  .msel-panel .msel-actions { display:flex; gap:8px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .msel-panel .msel-actions button { background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:700; cursor:pointer; padding:2px 0; }
  .msel-panel label { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); padding:5px 6px;
                       cursor:pointer; text-transform:none; white-space:nowrap; border-radius:6px; }
  .msel-panel label:hover { background:#f2f5fb; }
  .msel-panel input[type=checkbox] { flex-shrink:0; width:15px; height:15px; margin:0; accent-color:var(--navy-700); cursor:pointer; }

  /* ---------- per-column header filter (Excel-style, inside table.ntable th) ---------- */
  .colf { position:relative; display:inline-block; margin-left:6px; }
  .colf-btn { background:none; border:none; color:rgba(255,255,255,.55); cursor:pointer; font-size:11px; padding:2px 3px; line-height:1; }
  .colf-btn:hover { color:#fff; }
  .colf-btn.active { color:#ffd54f; }
  .colf-panel { color:var(--text); font-weight:400; }

  .tbl-toolbar { display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  .tbl-toolbar .search { display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:#fff; flex:1 1 200px; }
  .tbl-toolbar .search input { border:none; outline:none; font-size:13px; width:100%; }
  .tbl-toolbar select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; background:#fff; cursor:pointer; }
  .tbl-toolbar .count { font-size:12px; color:var(--muted); }
  .toggle-inline { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; }
  .tbl-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  @media (min-width:641px) {
    .tbl-scroll { max-height:70vh; overflow-y:auto; }
    table.ntable thead th { position:sticky; top:0; z-index:5; }
  }
  table.ntable { width:100%; border-collapse:collapse; font-size:13px; }
  table.ntable thead th { background:var(--navy-800); color:#fff; padding:9px 8px; font-weight:600; text-align:left; white-space:nowrap; position:relative; }
  table.ntable thead th.sortable { cursor:pointer; }
  table.ntable thead th.num, table.ntable tbody td.num { text-align:right; }
  table.ntable tbody td { padding:8px; border-bottom:1px solid var(--border); }
  table.ntable tbody tr.row-dead td { background:var(--dead-bg); color:var(--dead); font-weight:600; }
  table.ntable tbody tr.row-negative td { background:var(--negative-bg); }
  table.ntable tbody tr.row-behind td { background:var(--returncand-bg); }
  table.ntable td.empty { text-align:center; color:var(--muted); padding:24px; }
  .num { font-variant-numeric:tabular-nums; }

  .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px; font-size:13px; color:var(--muted); }
  .pager button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }

  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.DEAD{background:var(--dead-bg);color:var(--dead);}
  .pill.NEGATIVE{background:var(--negative-bg);color:var(--negative);}
  .pill.STALE{background:var(--stale-bg);color:var(--stale);}
  .pill.SLOW{background:var(--slow-bg);color:var(--slow);}
  .pill.SELLING{background:var(--selling-bg);color:var(--selling);}
  .pill.CLEARED{background:var(--cleared-bg);color:var(--cleared);}
  .pill.UNKNOWN{background:#eee;color:#666;}
  .pill.RETURNCAND{background:var(--returncand-bg);color:var(--returncand);}
  .pill.OK{background:var(--ok-bg);color:var(--ok);}

  .sm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .sm-card { border:1px solid var(--border); border-radius:12px; padding:12px; }
  .sm-card h3 { margin:0 0 4px; font-size:14px; }
  .sm-card .meta { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .sm-card .sm-sub { font-size:10.5px; color:var(--muted); margin:6px 0 4px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .sm-card table { width:100%; border-collapse:collapse; font-size:12px; }
  .sm-card td { padding:4px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
  .sm-card .danger { color:var(--dead); font-weight:700; }
  .sm-card tr.clickable-row:hover td { background:#eef3fb; }

  .kpi.clickable { cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .kpi.clickable:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(11,30,63,.16); }
  .kpi.clickable:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  table.ntable tbody tr.clickable-row { cursor:pointer; }
  table.ntable tbody tr.clickable-row:hover td { background:#eef3fb; }
  .item-detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .item-detail-grid .box { background:#f6f8fc; border-radius:9px; padding:8px 10px; }
  .item-detail-grid .box b { display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }
  .item-detail-grid .box span { font-size:16px; font-weight:700; color:var(--navy-800); }

  .legend-row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; font-size:12px; color:var(--muted); }
  .legend-item { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }

  /* ---------- loader (replaces the old plain spinner) ---------- */
  .loader { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:70px 20px; gap:18px; }
  .loader-rings { position:relative; width:66px; height:66px; }
  .loader-rings span { position:absolute; border-radius:50%; border:4px solid transparent; }
  .loader-rings span:nth-child(1) { inset:0; border-top-color:var(--accent); border-right-color:var(--accent); animation:pf-spin 1s linear infinite; }
  .loader-rings span:nth-child(2) { inset:11px; border-bottom-color:var(--navy-600); border-left-color:var(--navy-600); animation:pf-spin 1.3s linear infinite reverse; }
  .loader-rings i { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--navy-700); animation:pf-pulse 1.6s ease-in-out infinite; }
  @keyframes pf-spin { to { transform:rotate(360deg); } }
  @keyframes pf-pulse { 0%,100% { opacity:.45; transform:scale(.88); } 50% { opacity:1; transform:scale(1.08); } }
  .loader p { color:var(--muted); font-size:13px; font-weight:600; text-align:center; margin:0; line-height:1.5; }

  /* ---------- Not Selling: day picker ---------- */
  .days-picker { background:#f6f8fc; border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .days-picker > label { font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:8px; }
  .days-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .days-row input[type=number] { width:88px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:16px; font-weight:700; text-align:center; }
  .days-row .unit { font-size:12.5px; color:var(--muted); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 13px; font-size:12.5px; cursor:pointer; font-weight:600; color:var(--navy-700); }
  .chip.active { background:var(--navy-700); color:#fff; border-color:var(--navy-700); }

  .import-box textarea { width:100%; min-height:240px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; resize:vertical; padding:10px; border:1px solid var(--border); border-radius:9px; }
  .import-box .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  .btn-primary { background:var(--navy-700); color:#fff; border:none; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary:disabled { opacity:.55; cursor:default; }
  .btn-sm { background:#fff; color:var(--navy-700); border:1px solid var(--border); border-radius:8px; padding:6px 12px;
            font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn-sm:hover { background:#f2f5fb; }
  .btn-danger-sm { background:var(--dead-bg); color:var(--dead); border:none; border-radius:8px; padding:6px 12px;
                   font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn-danger-sm:hover { filter:brightness(.95); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.6; }

  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:16px; }
  .form-grid label { font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:5px; }
  .form-grid input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; }
  .form-grid .fhint { font-size:11px; color:var(--muted); margin-top:4px; }

  footer { text-align:center; color:var(--muted); font-size:11px; padding:16px; }

  @media (max-width:900px) {
    .sidebar { transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .topbar .hamburger { display:block; }
    .topbar .userchip { display:none; }
    .backdrop.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55; }
    .chart-grid { grid-template-columns:1fr; }
  }
  @media (max-width:640px) {
    .content { padding:12px; }
    .kpi .value { font-size:20px; }
    table.ntable thead { display:none; }
    table.ntable, table.ntable tbody, table.ntable tr, table.ntable td { display:block; width:100%; }
    table.ntable tbody tr { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; padding:6px; }
    table.ntable tbody td { border:none; display:flex; justify-content:space-between; gap:10px; padding:5px 6px; text-align:right; }
    table.ntable tbody td::before { content:attr(data-label); font-weight:600; color:var(--muted); text-align:left; }
  }
</style>
</head>

<div id="root">
  <div class="loader">
    <div class="loader-rings"><span></span><span></span><i class="fa-solid fa-shirt"></i></div>
    <p>Loading… / Load ho raha hai…</p>
  </div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useMemo, useContext } = React;

/* ================= helpers ================= */

function inr(n) {
  n = Number(n) || 0;
  const neg = n < 0;
  let s = Math.round(Math.abs(n)).toString();
  let last3 = s.slice(-3), rest = s.slice(0, -3);
  if (rest) { rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ','); last3 = ',' + last3; }
  return (neg ? '-₹' : '₹') + rest + last3;
}
function num(n) { return (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }

/* ---- date display: backend/storage stays ISO (YYYY-MM-DD) everywhere; only the screen shows
   it as DD-Mon-YYYY (e.g. 10-Sep-2026). Never feed fmtDate()'s output back to the server. ---- */
const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(iso);
  const mon = MONTH_ABBR[parseInt(m[2], 10) - 1] || m[2];
  return m[3] + '-' + mon + '-' + m[1];
}
/** "2026-09-10 14:32" -> "10-Sep-2026 14:32" */
function fmtDateTime(stamp) {
  if (!stamp) return '';
  const parts = String(stamp).split(' ');
  return fmtDate(parts[0]) + (parts[1] ? ' ' + parts[1] : '');
}
/** Reformat any YYYY-MM-DD substrings inside a longer server message/sentence. */
function fmtDatesInStr(s) { return String(s || '').replace(/\d{4}-\d{2}-\d{2}/g, m => fmtDate(m)); }

// promisified google.script.run with a client-side timeout so a big paste never hangs silently
function callServer(fn, args = [], timeoutMs = 120000) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('Open this page from the deployed Web-app URL (Deploy → Web app), not a file preview.'));
      return;
    }
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      reject(new Error('The server is taking too long. For a very large Stock paste, split it into ~8,000-row chunks and try again.'));
    }, timeoutMs);
    google.script.run
      .withSuccessHandler(v => { if (done) return; done = true; clearTimeout(timer); resolve(v); })
      .withFailureHandler(e => { if (done) return; done = true; clearTimeout(timer); reject(e); })
      [fn](...args);
  });
}

/* ---- auth (token kept in a module global + localStorage) ---- */
const AUTH_KEY = 'pf_auth_v1';
let AUTH_TOKEN = null;
function readAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; } }
function writeAuth(a) {
  AUTH_TOKEN = a ? a.token : null;
  try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {}
}
const _initAuth = readAuth();
AUTH_TOKEN = _initAuth ? _initAuth.token : null;

// every authenticated call appends the token as the LAST argument
function authed(fn, args = [], timeoutMs = 120000) { return callServer(fn, [...args, AUTH_TOKEN], timeoutMs); }

/** Click-to-drill-down: fetch an item's full history and show it in a modal. */
function showItemDetail(itemKey, fallbackDetails, L) {
  if (!itemKey) return;

  // (click outside / Esc / Cancel button), and once closed the eventual server response must be
  // ignored so it doesn't pop the detail modal back up after the user has already moved on.
  let cancelled = false;
  Swal.fire({
    title: L('Loading item…', 'Item Load Ho Raha Hai…'),
    html: '<div style="font-size:12px;color:var(--muted);margin-top:4px">' +
          L('Click outside, press Esc, or Cancel to close this.', 'Bahar click karo, Esc dabao, ya Cancel se band karo.') + '</div>',
    allowOutsideClick: true,
    allowEscapeKey: true,
    showCancelButton: true,
    cancelButtonText: L('Cancel', 'Cancel'),
    showConfirmButton: false,
    didOpen: () => Swal.showLoading(),
    willClose: () => { cancelled = true; },
  });
  authed('getItemHistory', [itemKey], 60000)
    .then(res => {
      if (cancelled) return;
      if (res && res.authError) { Swal.close(); return; }
      if (!res || !res.ok) {
        Swal.fire({ icon: 'error', title: L('Could not load item', 'Item Load Nahi Hua'), text: (res && res.message) || fallbackDetails || '' });
        return;
      }
      Swal.fire({
        title: res.item.details + (res.item.group ? ' · ' + res.item.group : ''),
        html: itemDetailHtml(res, L),
        width: 640,
        confirmButtonText: L('Close', 'Band Karo'),

    })
    .catch(e => { if (!cancelled) Swal.fire({ icon: 'error', title: L('Could not load item', 'Item Load Nahi Hua'), text: e.message || String(e) }); });
}

/* ================= error boundary — a crash must NEVER blank the page =================== */

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('ErrorBoundary:', err, info); }
  render() {
    if (this.state.err) {
      return (
        <div className="panel">
          <div className="alert err">
            <i className="fa-solid fa-circle-exclamation"></i>
            {this.props.label || 'This section'} hit an error: {String((this.state.err && this.state.err.message) || this.state.err)}
            <button onClick={() => this.setState({ err: null })}>Retry</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/** The value a column filters/searches on: filterValue > exportValue > value > raw field.
    (exportValue is reused here because most computed columns already define it for Excel export —
    same "what does this column really mean" value works for filtering.) */
function colFilterVal_(col, r) {
  if (col.filterValue) return col.filterValue(r);
  if (col.exportValue) return col.exportValue(r);
  if (col.value) return col.value(r);
  return r[col.key];
}

/** Position a popover panel anchored to a button via a portal to document.body with
    position:fixed — this is what actually avoids the panel getting clipped when the anchor sits
    inside a scrolling/sticky container (e.g. a sticky table header inside .tbl-scroll: an
    absolutely-positioned child there gets cut off by the scroll container's overflow, no matter
    how high its z-index is). Closes itself on scroll (position would otherwise go stale) or resize. */
function usePopoverPosition(open, anchorRef, panelRef, onClose, opts) {
  var align = (opts && opts.align) || 'left';
  var assumedW = (opts && opts.width) || 260;
  var assumedH = (opts && opts.height) || 300;
  const [pos, setPos] = useState(null);

  useLayoutEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return; }
    function place() {
      if (!anchorRef.current) return;
      const r = anchorRef.current.getBoundingClientRect();
      let left = align === 'right' ? r.right - assumedW : r.left;
      if (left < 8) left = 8;
      if (left + assumedW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - assumedW - 8);
      let top = r.bottom + 4;
      if (top + assumedH > window.innerHeight - 8 && r.top - assumedH - 4 > 8) top = r.top - assumedH - 4;
      setPos({ top, left });
    }
    place();
    // Scrolling something on the page (the table under it, the sidebar, the page itself) means
    // the anchor button likely moved, so close rather than show a now-misplaced panel. But
    // scrolling INSIDE the panel itself — its own checkbox list, e.g. while ticking boxes near
    // the bottom — must NOT close it; that was the bug (dropdown vanishing on drag/select).
    function onScroll(e) {
      if (panelRef && panelRef.current && e.target && panelRef.current.contains(e.target)) return;
      onClose();
    }
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', place);
    return () => { window.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', place); };
  }, [open]);

  return pos;
}

/** Excel-style per-column filter: a funnel icon in the header opens a searchable checkbox list.
    The option list is cascading — it only shows values that survive every OTHER active filter
    (column filters + the table search box), so picking a value in one column narrows what the
    next column's dropdown offers, same as Excel's AutoFilter. */
function ColumnFilterMenu({ options, selected, onChange }) {
  const { L } = useLang();
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const btnRef = useRef(null);
  const panelRef = useRef(null);
  const pos = usePopoverPosition(open, btnRef, panelRef, () => setOpen(false), { align: 'right', width: 240, height: 300 });

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (btnRef.current && btnRef.current.contains(e.target)) return;
      if (panelRef.current && panelRef.current.contains(e.target)) return;
      setOpen(false);
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);
  useEffect(() => { if (!open) setQ(''); }, [open]);

  function toggle(opt) {
    onChange(selected.indexOf(opt) > -1 ? selected.filter(x => x !== opt) : [...selected, opt]);
  }

  const needle = q.trim().toLowerCase();
  const visible = needle ? options.filter(o => String(o).toLowerCase().indexOf(needle) > -1) : options;
  const active = selected.length > 0;

  return (
    <span className="colf" onClick={e => e.stopPropagation()}>
      <button ref={btnRef} type="button" className={'colf-btn' + (active ? ' active' : '')} onClick={() => setOpen(o => !o)}
        title={L('Filter this column', 'Is column ko filter karo')}>
        <i className="fa-solid fa-filter"></i>
      </button>
      {open && pos && ReactDOM.createPortal(
        <div className="msel-panel colf-panel" ref={panelRef} style={{ top: pos.top, left: pos.left }}>
          {options.length > 6 && (
            <input type="text" className="msel-search" value={q} onChange={e => setQ(e.target.value)}
              placeholder={L('Search…', 'Dhundo…')} autoFocus />
          )}
          <div className="msel-actions">
            <button type="button" onClick={() => onChange(dedupe_(selected.concat(visible)))}>{L('Select all', 'Sab Select')}</button>
            <button type="button" onClick={() => onChange(selected.filter(s => visible.indexOf(s) < 0))}>{L('Clear', 'Clear')}</button>
          </div>
          {visible.length === 0 && <div style={{ fontSize: 12, color: 'var(--muted)', padding: '4px 2px' }}>{L('No match.', 'Kuch nahi mila.')}</div>}
          {visible.map(opt => (
            <label key={String(opt)}>
              <input type="checkbox" checked={selected.indexOf(opt) > -1} onChange={() => toggle(opt)} />
              {opt === '' || opt == null ? <i>({L('blank', 'khaali')})</i> : String(opt)}
            </label>
          ))}
        </div>,
        document.body
      )}
    </span>
  );
}

function NativeTable({ columns, rows, pageSize = 25, defaultSort, pinFn, getRowClass, emptyText, onRowClick }) {
  const [q, setQ] = useState('');
  const [colFilters, setColFilters] = useState({}); // { colKey: [selected values] }
  const [sort, setSort] = useState(defaultSort || { key: columns[0].key, dir: 'asc' });
  const [page, setPage] = useState(0);

  useEffect(() => { setPage(0); }, [q, rows, colFilters]);

  // text search across all columns
  const searched = useMemo(() => {
    const needle = q.trim().toLowerCase();
    if (!needle) return rows;
    return rows.filter(r => columns.some(c => {
      const v = c.search ? c.search(r) : (c.value ? c.value(r) : r[c.key]);
      return String(v == null ? '' : v).toLowerCase().indexOf(needle) > -1;
    }));
  }, [rows, q, columns]);

  function passesColFilters(r, exceptKey) {
    return columns.every(c => {
      if (c.key === exceptKey) return true;
      const sel = colFilters[c.key];
      if (!sel || sel.length === 0) return true;
      return sel.indexOf(colFilterVal_(c, r)) > -1;
    });
  }

  // cascading options for one column's dropdown: searched rows, narrowed by every OTHER
  // column's active filter (but not this column's own — so you can still widen it back).
  // Keeps 0 and '' as real, selectable values (unlike uniqueSorted, which drops falsy values —
  // fine for name lists, wrong here since a qty/balance column can legitimately be 0).
  function columnOptions(col) {
    const base = searched.filter(r => passesColFilters(r, col.key));
    const set = new Set();
    base.forEach(r => { const v = colFilterVal_(col, r); if (v !== null && v !== undefined) set.add(v); });
    return Array.from(set).sort((a, b) => {
      if (typeof a === 'number' && typeof b === 'number') return a - b;
      return String(a).localeCompare(String(b));
    });
  }

  const colFiltered = useMemo(() => searched.filter(r => passesColFilters(r, null)),
    [searched, colFilters, columns]);

  const activeColFilterCount = Object.keys(colFilters).filter(k => (colFilters[k] || []).length > 0).length;

  const sorted = useMemo(() => {
    const col = columns.find(c => c.key === sort.key);
    const arr = colFiltered.slice();
    arr.sort((a, b) => {
      if (pinFn) { const pa = pinFn(a), pb = pinFn(b); if (pa !== pb) return pb - pa; }
      if (!col) return 0;
      let va = col.sortValue ? col.sortValue(a) : (col.value ? col.value(a) : a[col.key]);
      let vb = col.sortValue ? col.sortValue(b) : (col.value ? col.value(b) : b[col.key]);
      if (va == null) va = -Infinity;
      if (vb == null) vb = -Infinity;
      if (typeof va === 'string' || typeof vb === 'string') { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
      const cmp = va < vb ? -1 : va > vb ? 1 : 0;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return arr;
  }, [colFiltered, sort, columns, pinFn]);

  const pages = Math.max(1, Math.ceil(sorted.length / pageSize));
  const cur = Math.min(page, pages - 1);
  const slice = sorted.slice(cur * pageSize, cur * pageSize + pageSize);

  function clickSort(key, sortable) {
    if (sortable === false) return;
    setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
  }

  return (
    <div>
      <div className="tbl-toolbar">
        <div className="search">
          <i className="fa-solid fa-magnifying-glass" style={{ color: 'var(--muted)' }}></i>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search…" />
        </div>
        {activeColFilterCount > 0 && (
          <button type="button" className="chip active" onClick={() => setColFilters({})}>
            <i className="fa-solid fa-filter-circle-xmark"></i> {activeColFilterCount} column filter{activeColFilterCount === 1 ? '' : 's'} — clear
          </button>
        )}
        <div className="count">{sorted.length} row{sorted.length === 1 ? '' : 's'}</div>
      </div>

      <div className="tbl-scroll">
        <table className="ntable">
          <thead>
            <tr>{columns.map(c => (
              <th key={c.key}
                  className={(c.align === 'right' ? 'num ' : '') + (c.sortable === false ? '' : 'sortable')}
                  onClick={() => clickSort(c.key, c.sortable)}>
                {c.label}
                {sort.key === c.key && (
                  <i className={'fa-solid ' + (sort.dir === 'asc' ? 'fa-caret-up' : 'fa-caret-down')} style={{ marginLeft: 4 }}></i>
                )}
                {c.filterable !== false && (
                  <ColumnFilterMenu options={columnOptions(c)} selected={colFilters[c.key] || []}
                    onChange={sel => setColFilters(f => ({ ...f, [c.key]: sel }))} />
                )}
              </th>
            ))}</tr>
          </thead>
          <tbody>
            {slice.length === 0 && <tr><td className="empty" colSpan={columns.length}>{emptyText || 'No rows'}</td></tr>}
            {slice.map((r, i) => (
              <tr key={i}
                  className={(getRowClass ? getRowClass(r) : '') + (onRowClick ? ' clickable-row' : '')}
                  onClick={onRowClick ? () => onRowClick(r) : undefined}>
                {columns.map(c => (
                  <td key={c.key} data-label={c.label} className={c.align === 'right' ? 'num' : ''}>
                    {c.render ? c.render(r) : (r[c.key] == null ? '' : String(r[c.key]))}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="pager">
        <button disabled={cur === 0} onClick={() => setPage(cur - 1)}><i className="fa-solid fa-chevron-left"></i> Prev</button>
        <span>Page {cur + 1} / {pages}</span>
        <button disabled={cur >= pages - 1} onClick={() => setPage(cur + 1)}>Next <i className="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  );
}

function useChart(makeConfig, deps) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const cfg = makeConfig();
    if (ref.current && cfg) chartRef.current = new Chart(ref.current, cfg);
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, deps);
  return ref;
}

function GroupBarChart({ data }) {
  const { L, lang } = useLang();

/** "1300 CHOICE G/M, ABC TRADERS +2 more" -> ['1300 CHOICE G/M', 'ABC TRADERS'] (drops the "+N more" tail). */
function parseSuppliers(str) {
  return String(str || '').split(',').map(s => s.trim()).filter(s => s && !/^\+\d+\s*more$/i.test(s));
}
function uniqueSorted(list) { return Array.from(new Set(list.filter(Boolean))).sort(); }
/** Dedupe WITHOUT dropping falsy values (0, '') — unlike uniqueSorted, safe for "select all" on
    filter panels whose options can legitimately include 0 or blank. */
function dedupe_(list) { return Array.from(new Set(list)); }

/** Sum `valueFn(row)` into each of `keysFn(row)` (a row can contribute to more than one key
    e.g. an item with two suppliers splits its value between them), then sort desc. */
function aggregateByDim(rows, keysFn, valueFn) {
  const map = {};
  rows.forEach(r => {
    const keys = keysFn(r);
    if (!keys.length) return;
    const val = valueFn(r) / keys.length;
    keys.forEach(k => { map[k] = (map[k] || 0) + val; });
  });
  return Object.keys(map).map(k => ({ key: k, value: map[k] })).sort((a, b) => b.value - a.value);
}

/** Checkbox-panel multi-select filter. `selected` = [] means "all" (no filter applied).
    Has its own search box when there are enough options to make scanning them impractical. */
function MultiSelect({ label, allLabel, options, selected, onChange, searchPlaceholder }) {
  const { L } = useLang();
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const btnRef = useRef(null);
  const panelRef = useRef(null);
  const pos = usePopoverPosition(open, btnRef, panelRef, () => setOpen(false), { align: 'left', width: 260, height: 300 });

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (btnRef.current && btnRef.current.contains(e.target)) return;
      if (panelRef.current && panelRef.current.contains(e.target)) return;
      setOpen(false);
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  useEffect(() => { if (!open) setQ(''); }, [open]);

  function toggle(opt) {
    onChange(selected.indexOf(opt) > -1 ? selected.filter(x => x !== opt) : [...selected, opt]);
  }

  const summary = selected.length === 0 ? allLabel
    : selected.length <= 2 ? selected.join(', ')
    : selected.length + ' selected';

  const needle = q.trim().toLowerCase();
  const visibleOptions = needle ? options.filter(o => String(o).toLowerCase().indexOf(needle) > -1) : options;

  return (
    <div className="msel">
      <label>{label}</label>
      <button ref={btnRef} type="button" className="msel-btn" onClick={() => setOpen(o => !o)}>
        <span className="txt">{summary}</span>
        <i className={'fa-solid ' + (open ? 'fa-caret-up' : 'fa-caret-down')} style={{ color: 'var(--muted)', flexShrink: 0 }}></i>
      </button>
      {open && pos && ReactDOM.createPortal(
        <div className="msel-panel" ref={panelRef} style={{ top: pos.top, left: pos.left }}>
          {options.length > 6 && (
            <input type="text" className="msel-search" value={q} onChange={e => setQ(e.target.value)}
              placeholder={searchPlaceholder || L('Search…', 'Dhundo…')} autoFocus />
          )}
          <div className="msel-actions">
            <button type="button" onClick={() => onChange(dedupe_(selected.concat(visibleOptions)))}>{L('Select all', 'Sab Select')}</button>
            <button type="button" onClick={() => onChange(selected.filter(s => visibleOptions.indexOf(s) < 0))}>{L('Clear', 'Clear')}</button>
          </div>
          {visibleOptions.length === 0 && <div style={{ fontSize: 12, color: 'var(--muted)', padding: '4px 2px' }}>{L('No match.', 'Kuch nahi mila.')}</div>}
          {visibleOptions.map(opt => (
            <label key={opt}>
              <input type="checkbox" checked={selected.indexOf(opt) > -1} onChange={() => toggle(opt)} />
              {opt}
            </label>
          ))}
        </div>,
        document.body
      )}
    </div>
  );
}

/**
 * Age-based sell-through target ("return candidate" check): how much of what was purchased
 * should be sold by now, counting from the LAST purchase date. 10+ days -> 50%, 20+ days -> 75%,
 * 30+ days -> 100%. Before 10 days there's no target yet (too early to judge).
 * GRACE_PCT gives a couple of points of slack either way before something is flagged.
 * LIMITATION: this reads Items' lifetime cumulative purchased/sold — there is no lot/batch
 * tracking (Busy doesn't provide it either), so for an item bought more than once
 * (purchase_entries > 1) the % mixes old and new stock. Such rows carry a "Repeat" badge in the
 * UI so the number is read as an estimate, not an exact per-batch figure.
 */
const SELL_TARGET_TIERS = [ { days: 30, pct: 100 }, { days: 20, pct: 75 }, { days: 10, pct: 50 } ];
const SELL_TARGET_GRACE_PCT = 2;
function expectedSellPct(daysSincePurchase) {
  if (daysSincePurchase == null) return null;
  for (let i = 0; i < SELL_TARGET_TIERS.length; i++) {
    if (daysSincePurchase >= SELL_TARGET_TIERS[i].days) return SELL_TARGET_TIERS[i].pct;
  }
  return null;
}

const STATUS_LEGEND = [
  { code: 'DEAD',     en: 'Bought but not selling at all — biggest concern', hi: 'Khareeda gaya, bilkul bik nahi raha — sabse zyada dhyan do' },
  { code: 'STALE',    en: 'No recent buying or selling movement',            hi: 'Haal mein na kharid na bikri' },
  { code: 'SLOW',     en: 'Selling, but slowly',                             hi: 'Bik raha hai, par dheere' },
  { code: 'SELLING',  en: 'Selling normally — healthy',                      hi: 'Normal bik raha hai — theek hai' },
  { code: 'CLEARED',  en: 'Fully sold — nothing pending',                    hi: 'Pura bik gaya — kuch pending nahi' },
  { code: 'NEGATIVE', en: 'Stock shows negative — data-entry issue in Busy', hi: 'Stock negative — Busy mein data ki galti' },
];

/* ================= Full Report (self-contained — fetches its own data) ================= */

function FullReportView({ initialFilter }) {
  const { L, lang } = useLang();
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);
  const [days, setDays] = useState(30);
  const [showAll, setShowAll] = useState(!!(initialFilter && initialFilter.showAll));
  const [group, setGroup] = useState((initialFilter && initialFilter.group) || []);
  const [itemName, setItemName] = useState((initialFilter && initialFilter.itemName) || []);
  const [salesman, setSalesman] = useState((initialFilter && initialFilter.salesman) || []);
  const [supplier, setSupplier] = useState((initialFilter && initialFilter.supplier) || []);
  const [status, setStatus] = useState((initialFilter && initialFilter.status) || []);
  const [balanceMode, setBalanceMode] = useState('all'); // all | nonzero | zero
  const [onlyBehind, setOnlyBehind] = useState(false);
  const [onlyReliable, setOnlyReliable] = useState(false);

  function load() {
    setRows(null); setErr(null);
    authed('getItemReport', [], 120000)
      .then(res => {
        if (res && res.authError) return;
        if (!res || !res.ok) { setErr((res && res.message) || 'Could not load report.'); return; }
        setRows(res);
      })
      .catch(e => setErr(e.message || String(e)));
  }
  useEffect(() => { load(); }, []);

  // Step 1 — day scope (the base every other filter narrows from; changing group/salesman/etc
  // below never resets this or each other, they all just stack on top). Also where the
  // age-based sell-through target (_targetPct/_actualPct/_behindTarget) gets computed.
  const dayScoped = useMemo(() => {
    if (!rows) return [];
    return rows.rows
      .filter(r => showAll || (r.days_since_purchase != null && r.days_since_purchase <= days))
      .map(r => {
        const actualPct = r.net_purchase_qty > 0 ? (r.sale_qty / r.net_purchase_qty * 100) : 0;
        const targetPct = expectedSellPct(r.days_since_purchase);
        return Object.assign({}, r, {
          _actualPct: actualPct, _targetPct: targetPct,
          _behindTarget: targetPct != null && actualPct < (targetPct - SELL_TARGET_GRACE_PCT),
          _isRepeat: (r.purchase_entries || 0) > 1
        });
      });
  }, [rows, days, showAll]);

  const groupOptions    = useMemo(() => uniqueSorted(dayScoped.map(r => r.group)), [dayScoped]);
  const itemOptions     = useMemo(() => uniqueSorted(dayScoped.map(r => r.details)), [dayScoped]);
  const salesmanOptions = useMemo(() => uniqueSorted(dayScoped.flatMap(r => r.salesmen || [])), [dayScoped]);
  const supplierOptions = useMemo(() => uniqueSorted(dayScoped.flatMap(r => parseSuppliers(r.suppliers))), [dayScoped]);

  // Step 2 — the dimension filters, independent of each other, of balance-mode and of the
  // behind-target toggle (zeroRows below is built from this and stays unaffected by either).
  const dimFiltered = useMemo(() => dayScoped
    .filter(r => group.length === 0 || group.indexOf(r.group) > -1)
    .filter(r => itemName.length === 0 || itemName.indexOf(r.details) > -1)
    .filter(r => salesman.length === 0 || (r.salesmen || []).some(s => salesman.indexOf(s) > -1))
    .filter(r => supplier.length === 0 || parseSuppliers(r.suppliers).some(s => supplier.indexOf(s) > -1))
    .filter(r => status.length === 0 || status.indexOf(r.status) > -1),
  [dayScoped, group, itemName, salesman, supplier, status]);

  // Step 3 — balance mode + behind-target + reliable-only toggles on top (drives table + charts).
  const filtered = useMemo(() => dimFiltered
    .filter(r => balanceMode === 'all' ? true : balanceMode === 'zero' ? r.pending_balance === 0 : r.pending_balance !== 0)
    .filter(r => !onlyBehind || r._behindTarget)
    .filter(r => !onlyReliable || !r._isRepeat),
  [dimFiltered, balanceMode, onlyBehind, onlyReliable]);

  // Always-available zero-balance slice (same dimension filters, ignores balance-mode) — this is
  // exactly what goes into the separate "Zero Balance" sheet on export.
  const zeroRows = useMemo(() => dimFiltered.filter(r => r.pending_balance === 0), [dimFiltered]);

  // Executive summary numbers, computed from the same `filtered` set the table shows.
  const kpi = useMemo(() => {
    const purQty = filtered.reduce((s, r) => s + r.purchase_qty, 0);
    const saleQty = filtered.reduce((s, r) => s + r.sale_qty, 0);
    const pendingQty = filtered.reduce((s, r) => s + Math.max(0, r.pending_balance), 0);
    const pendingVal = filtered.reduce((s, r) => s + Math.max(0, r.pending_value), 0);
    const zeroCount = filtered.filter(r => r.pending_balance === 0).length;
    const negCount = filtered.filter(r => r.pending_balance < 0).length;
    const behindItems = filtered.filter(r => r._behindTarget);
    return {
      items: filtered.length, purQty, saleQty, pendingQty, pendingVal, zeroCount, negCount,
      soldPct: purQty > 0 ? (saleQty / purQty * 100) : 0,
      suppliers: uniqueSorted(filtered.flatMap(r => parseSuppliers(r.suppliers))).length,
      salesmen: uniqueSorted(filtered.flatMap(r => r.salesmen || [])).length,
      behindCount: behindItems.length,
      behindValue: behindItems.reduce((s, r) => s + Math.max(0, r.pending_value), 0),
    };
  }, [filtered]);

  const byGroup    = useMemo(() => aggregateByDim(filtered, r => [r.group || '(no group)'], r => Math.max(0, r.pending_value)).slice(0, 12), [filtered]);
  const bySalesman = useMemo(() => aggregateByDim(filtered, r => (r.salesmen && r.salesmen.length ? r.salesmen : ['(unknown)']), r => Math.max(0, r.pending_value)).slice(0, 12), [filtered]);
  const bySupplier = useMemo(() => aggregateByDim(filtered, r => { const s = parseSuppliers(r.suppliers); return s.length ? s : ['(unknown)']; }, r => Math.max(0, r.pending_value)).slice(0, 12), [filtered]);
  const statusCounts = useMemo(() => {
    const m = {};
    filtered.forEach(r => { m[r.status] = (m[r.status] || 0) + 1; });
    return m;
  }, [filtered]);

  const columns = [
    { key: 'group', label: L('Group', 'Group') },
    { key: 'details', label: L('Item Details', 'Item ka Naam') },
    // ---- headline columns first: what to DO about this item, no scrolling needed ----
    { key: '_action', label: L('Action', 'Action'), sortValue: r => r._behindTarget ? 2 : r._targetPct == null ? 1 : 0,
      render: r => r._behindTarget
        ? <span className="pill RETURNCAND">{L('RETURN CANDIDATE', 'RETURN CANDIDATE')}</span>
        : r._targetPct == null
          ? <span className="pill UNKNOWN">{L('Waiting', 'Wait Karo')}</span>
          : <span className="pill OK">{L('OK', 'OK')}</span>,
      exportValue: r => r._behindTarget ? 'RETURN CANDIDATE' : r._targetPct == null ? 'Waiting' : 'OK' },
    { key: '_targetPct', label: L('Target %', 'Target %'), align: 'right', sortValue: r => r._targetPct == null ? -1 : r._targetPct,
      render: r => r._targetPct == null
        ? <span style={{ color: 'var(--muted)' }}>{L('too early', 'abhi jaldi hai')}<br /><small>{r.days_since_purchase == null ? '' : '(' + r.days_since_purchase + '/10 ' + L('days', 'din') + ')'}</small></span>
        : r._targetPct + '%',
      exportValue: r => r._targetPct == null ? '' : r._targetPct },
    { key: '_actualPct', label: L('Actual %', 'Actual %'), align: 'right', sortValue: r => r._actualPct,
      render: r => <b style={{ color: r._behindTarget ? 'var(--dead)' : 'var(--selling)' }}>{r._actualPct.toFixed(0)}%</b>,
      exportValue: r => Math.round(r._actualPct * 100) / 100 },
    // ---- buy / sell / balance — kept together on purpose ----
    { key: 'purchase_qty', label: L('Purchase Qty', 'Kharid Qty'), align: 'right', sortValue: r => r.purchase_qty, render: r => num(r.purchase_qty) },
    { key: 'purchase_return_qty', label: L('Purchase Return Qty', 'Purchase Return'), align: 'right', sortValue: r => r.purchase_return_qty, render: r => num(r.purchase_return_qty) },
    { key: 'net_purchase_qty', label: L('Net Purchase Qty', 'Net Kharid'), align: 'right', sortValue: r => r.net_purchase_qty, render: r => num(r.net_purchase_qty) },
    { key: 'sale_qty', label: L('Sale Qty', 'Bikri Qty'), align: 'right', sortValue: r => r.sale_qty, render: r => num(r.sale_qty) },
    { key: 'sale_entries', label: L('Sale Entries', 'Kitni Baar Bika'), align: 'right', sortValue: r => r.sale_entries, render: r => num(r.sale_entries) },
    { key: 'pending_balance', label: L('Pending Balance', 'Bacha Hua Balance'), align: 'right', sortValue: r => r.pending_balance,
      render: r => <b style={{ color: r.pending_balance < 0 ? 'var(--dead)' : r.pending_balance === 0 ? 'var(--muted)' : 'inherit' }}>{num(r.pending_balance)}</b> },
    { key: 'status', label: L('Status', 'Status'), sortValue: r => STATUS_LIST.indexOf(r.status),

      </span>,

      render: r => r.sale_qty > 0 ? inr(r.sale_rate_avg) : <span style={{ color: 'var(--muted)' }}>{L('not sold', 'nahi bika')}</span>,

  function exportToExcel() {

/* ================= Cancelled Bills (cancel a bill by number, restore any time) ================= */

const BILL_TYPES = [
  { v: 'ALL', en: 'Any type', hi: 'Koi bhi type' },
  { v: 'PURCHASE', en: 'Purchase', hi: 'Purchase' },
  { v: 'SALE', en: 'Sale', hi: 'Sale' },
  { v: 'PURCHASE_RETURN', en: 'Purchase Return', hi: 'Purchase Return' },
  { v: 'SALE_RETURN', en: 'Sale Return', hi: 'Sale Return' },
];

function CancelledBillsView() {
  const { L } = useLang();
  const [billNo, setBillNo] = useState('');
  const [billType, setBillType] = useState('ALL');
  const [busy, setBusy] = useState(false);
  const [bills, setBills] = useState(null);
  const [err, setErr] = useState(null);

  function load() {
    setErr(null);
    authed('getCancelledBills', [], 60000)
      .then(res => {
        if (res && res.authError) return;
        if (!res || !res.ok) { setErr((res && res.message) || 'Could not load cancelled bills.'); return; }
        setBills(res.bills);
      })
      .catch(e => setErr(e.message || String(e)));
  }
  useEffect(() => { load(); }, []);

  function cancelBill() {
    const bn = billNo.trim();
    if (!bn) { Swal.fire({ icon: 'info', title: L('Enter a bill number first', 'Pehle bill number daalo') }); return; }
    setBusy(true);
    authed('previewBillCancel', [bn, billType], 60000)
      .then(res => {
        setBusy(false);
        if (res && res.authError) return;
        if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Not found', 'Nahi Mila'), text: fmtDatesInStr((res && res.message) || '') }); return; }
        const itemList = res.items.slice(0, 10).map(x => '• ' + x).join('<br>') + (res.items.length > 10 ? '<br>… +' + (res.items.length - 10) + ' more' : '');
        Swal.fire({
          icon: 'warning',
          title: L('Cancel bill "' + res.bill_no + '"?', '"' + res.bill_no + '" bill cancel karein?'),
          html: '<div style="text-align:left;font-size:13px;line-height:1.7">' +
            L('Type(s): <b>' + res.types.join(', ') + '</b><br>Rows: <b>' + res.rows + '</b> · Qty: <b>' + num(res.qty) + '</b> · Amount: <b>' + inr(res.amount) + '</b><br>Date range: <b>' + fmtDate(res.date_from) + ' → ' + fmtDate(res.date_to) + '</b><br><br>Items:<br>' + itemList + '<br><br>This reverses these transactions out of stock/salesman totals. You can restore it later from this page.',
               'Type: <b>' + res.types.join(', ') + '</b><br>Rows: <b>' + res.rows + '</b> · Qty: <b>' + num(res.qty) + '</b> · Amount: <b>' + inr(res.amount) + '</b><br>Date range: <b>' + fmtDate(res.date_from) + ' → ' + fmtDate(res.date_to) + '</b><br><br>Items:<br>' + itemList + '<br><br>Ye transactions stock/salesman totals se hat jayengi. Baad mein isi page se restore kar sakte ho.') +
            '</div>',
          showCancelButton: true, confirmButtonText: L('Yes, cancel it', 'Haan, Cancel Karo'), confirmButtonColor: '#c62828',
          cancelButtonText: L('No', 'Nahi'),
        }).then(r => {
          if (!r.isConfirmed) return;
          setBusy(true);
          authed('cancelBillByNumber', [bn, billType], 60000)
            .then(res2 => {
              setBusy(false);
              if (res2 && res2.authError) return;
              if (!res2 || !res2.ok) { Swal.fire({ icon: 'error', title: L('Could not cancel', 'Cancel Nahi Hua'), text: (res2 && res2.message) || '' }); return; }
              Swal.fire({ icon: 'success', title: L('Bill cancelled', 'Bill Cancel Ho Gaya'), text: res2.rows + ' ' + L('row(s) reversed.', 'row(s) reverse ho gayi.') });
              setBillNo('');
              load();
            })
            .catch(e => { setBusy(false); Swal.fire({ icon: 'error', title: L('Could not cancel', 'Cancel Nahi Hua'), text: e.message || String(e) }); });
        });
      })
      .catch(e => { setBusy(false); Swal.fire({ icon: 'error', title: L('Could not check', 'Check Nahi Ho Paya'), text: e.message || String(e) }); });
  }

  function restoreBill(b) {
    Swal.fire({
      icon: 'warning', title: L('Restore this bill?', 'Ye Bill Restore Karein?'),
      html: '<div style="text-align:left;font-size:13px;line-height:1.7">' +
        L('Bill <b>' + b.bill_no + '</b> (' + b.types.join(', ') + ') — ' + b.rows + ' row(s), qty ' + num(b.qty) + ', ' + inr(b.amount) + '.<br>This adds it back into stock/salesman totals.',
           'Bill <b>' + b.bill_no + '</b> (' + b.types.join(', ') + ') — ' + b.rows + ' row(s), qty ' + num(b.qty) + ', ' + inr(b.amount) + '.<br>Ye wapas stock/salesman totals mein jud jayega.') +
        '</div>',
      showCancelButton: true, confirmButtonText: L('Yes, restore', 'Haan, Restore Karo'), cancelButtonText: L('No', 'Nahi'),
    }).then(r => {
      if (!r.isConfirmed) return;
      Swal.fire({ title: L('Restoring…', 'Restore Ho Raha Hai…'), allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      authed('restoreCancelledBill', [b.cancel_id], 60000)
        .then(res => {
          if (res && res.authError) { Swal.close(); return; }
          if (!res || !res.ok) { Swal.fire({ icon: 'error', title: L('Could not restore', 'Restore Nahi Hua'), text: (res && res.message) || '' }); return; }
          Swal.fire({ icon: 'success', title: L('Restored', 'Restore Ho Gaya'), text: res.restored + ' ' + L('row(s) added back.', 'row(s) wapas jud gayi.') });
          load();
        })
        .catch(e => Swal.fire({ icon: 'error', title: L('Could not restore', 'Restore Nahi Hua'), text: e.message || String(e) }));
    });
  }

  const columns = [
    { key: 'bill_no', label: L('Bill / Voucher No.', 'Bill / Voucher No.') },
    { key: 'types', label: L('Type(s)', 'Type'), render: r => r.types.join(', '), exportValue: r => r.types.join(', ') },
    { key: 'rows', label: L('Rows', 'Rows'), align: 'right', sortValue: r => r.rows, render: r => num(r.rows) },
    { key: 'qty', label: L('Qty', 'Qty'), align: 'right', sortValue: r => r.qty, render: r => num(r.qty) },
    { key: 'amount', label: L('Amount', 'Amount'), align: 'right', sortValue: r => r.amount, render: r => inr(r.amount) },
    { key: 'date_from', label: L('Date Range', 'Date Range'), render: r => (fmtDate(r.date_from) || '—') + ' → ' + (fmtDate(r.date_to) || '—') },
    { key: 'items', label: L('Items', 'Items'), render: r => r.items.slice(0, 2).join(', ') + (r.items.length > 2 ? ' +' + (r.items.length - 2) + ' more' : ''), exportValue: r => r.items.join(', ') },
    { key: 'cancelled_by', label: L('Cancelled By', 'Kisne Cancel Kiya') },
    { key: 'cancelled_at', label: L('Cancelled At', 'Kab Cancel Kiya'), render: r => fmtDateTime(r.cancelled_at) },
    { key: '_restore', label: L('Action', 'Action'), sortable: false, filterable: false,
      render: r => <button className="btn-primary" style={{ padding: '5px 12px', fontSize: 12 }} onClick={e => { e.stopPropagation(); restoreBill(r); }}>
        <i className="fa-solid fa-rotate-left"></i> {L('Restore', 'Restore')}
      </button> },
  ];

  return (
    <>
      <div className="panel">
        <h2>{L('Cancel a bill', 'Bill Cancel Karo')} <small>· {L('enter a bill/voucher number to reverse it out of stock and salesman totals', 'stock aur salesman totals se hatane ke liye bill/voucher number daalo')}</small></h2>
        <div className="filters" style={{ alignItems: 'flex-end' }}>
          <div>
            <label>{L('Bill / Voucher No.', 'Bill / Voucher No.')}</label>
            <input type="text" value={billNo} onChange={e => setBillNo(e.target.value)} placeholder={L('e.g. S-1042', 'jaise S-1042')} style={{ minWidth: 160 }} />
          </div>
          <div>
            <label>{L('Type', 'Type')}</label>
            <select value={billType} onChange={e => setBillType(e.target.value)}>
              {BILL_TYPES.map(t => <option key={t.v} value={t.v}>{L(t.en, t.hi)}</option>)}
            </select>
          </div>
          <button className="btn-primary" disabled={busy} onClick={cancelBill}>
            {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> {L('Checking…', 'Check Ho Raha Hai…')}</> : <><i className="fa-solid fa-ban"></i> {L('Find & Cancel', 'Dhundo & Cancel Karo')}</>}
          </button>
        </div>
        <div className="hint">
          {L('Only bills whose transactions are still inside the recent detail window (Settings → Transaction detail retention) can be cancelled this way. You will see exactly what will be affected before anything changes.',
             'Sirf wo bills cancel ho sakte hain jinki transactions abhi bhi haal ke detail window mein hain (Settings → Transaction detail retention). Kuch bhi badalne se pehle exactly kya affect hoga wo dikhaya jayega.')}
        </div>
      </div>

      <div className="panel">
        <h2>{L('Cancelled bills', 'Cancel Kiye Hue Bills')} <small>· {L('currently reversed out — restore any of them any time', 'abhi reverse kiye hue — kabhi bhi restore kar sakte ho')}</small></h2>
        {err && <div className="alert err"><i className="fa-solid fa-circle-exclamation"></i> {err}<button onClick={load}>{L('Retry', 'Dobara Try Karo')}</button></div>}
        {!err && !bills && <div className="hint">{L('Loading…', 'Load ho raha hai…')}</div>}
        {!err && bills && bills.length === 0 && (
          <div><i className="fa-solid fa-circle-check" style={{ color: 'var(--selling)' }}></i>{' '}{L('No cancelled bills.', 'Koi bill cancel nahi hai.')}</div>
        )}
        {!err && bills && bills.length > 0 && (
          <NativeTable columns={columns} rows={bills} pageSize={25}
            defaultSort={{ key: 'cancelled_at', dir: 'desc' }}
            emptyText={L('No cancelled bills.', 'Koi bill cancel nahi hai.')} />
        )}
      </div>
    </>
  );
}

  const columns = [
    { key: 'type', label: L('Type', 'Type'), render: r => <span className="pill UNKNOWN">{r.type}</span> },

      <h2>{L('Unmatched & group-mismatch', 'Gadbadi & Group-Mismatch')} <small>· {L('fix in Busy, then re-import', 'Busy mein thik karke dobara import karo')}</small></h2>
